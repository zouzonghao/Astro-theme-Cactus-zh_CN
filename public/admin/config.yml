backend:
  name: github
  repo: zouzonghao/Astro-theme-Cactus-zh_CN # 1、改成你的 GitHub 仓库，如 zouzonghao/astro-cactus
  branch: feature # 2、改成你的分支（一般为 main）
  base_url: https://cactus.343700.xyz/ # 3、改成你的线上域名（不带末尾斜杠）
  site_domain: cactus.343700.xyz # 4、改成你的线上域名（用于后台"查看站点"链接，可留空）
  auth_endpoint: oauth # 本项目 /oauth 路由提供的认证端点，无需修改

media_folder: public/assets/images # 上传的图片在仓库中的存放位置
public_folder: /assets/images # 上传图片的访问路径前缀

# 在 CMS 内直传的图片自动压缩为 AVIF（Squoosh WASM 在浏览器内完成，大图需等待数秒）
# 输出格式支持 avif / webp / jpeg；动图 GIF 默认跳过压缩以免丢失动画帧
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: avif # 压缩率最高；追求速度可换 webp
          quality: 60
          width: 2048 # 超出自动缩小
          height: 2048

collections:
  - name: "post"
    label: "博文"
    label_singular: "博文"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # 排序菜单默认不含自定义日期字段，需显式声明；默认按发布时间倒序（最新在前）
    sortable_fields:
      fields:
        - publishDate
        - title
      default:
        field: publishDate
        direction: descending
    fields:
      - { label: "标题", name: "title", widget: "string", required: true }
      - {
          label: "简介",
          name: "description",
          widget: "string",
          required: false,
          default: "一篇有意思的文章",
          hint: 摘要/SEO 描述，懒得写就保留默认,
        }
      - {
          label: "发布日期",
          name: "publishDate",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: true,
        }
      - { label: "标签", name: "tags", widget: "list", required: false, default: [] }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "置顶", name: "pinned", widget: "boolean", default: false, required: false }
      - {
          label: "访问密码（留空为公开，设置后正文加密，需密码解锁）",
          name: "password",
          widget: "string",
          required: false,
          default: "",
        }
      - { label: "密码提示（可选，显示在密码框下方）", name: "passwordHint", widget: "string", required: false, default: "" }
      - {
          label: "OG 分享图（可选，默认自动生成）",
          name: "ogImage",
          widget: "string",
          required: false,
        }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "note"
    label: "笔记"
    label_singular: "笔记"
    folder: "content/notes"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields:
      fields:
        - publishDate
        - title
      default:
        field: publishDate
        direction: descending
    fields:
      - { label: "标题", name: "title", widget: "string", required: true }
      - { label: "简介", name: "description", widget: "string", required: false }
      - {
          label: "发布日期",
          name: "publishDate",
          widget: "datetime",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm:ss",
          required: true,
        }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "tag"
    label: "标签页"
    label_singular: "标签页"
    folder: "content/tags"
    create: true
    slug: "{{fields.tag_name}}" # 文件名 = 标签名（查找键），由下方"标签名"字段生成，而非标题
    fields:
      - label: 标签名（即文件名）
        name: tag_name
        widget: string
        required: true
        hint: 必须与文章 frontmatter 里的标签名完全一致，例如文章标签为 test 这里就填 test
      - { label: "显示标题（可选，覆盖标签页大标题）", name: "title", widget: "string", required: false }
      - { label: "描述（可选，用于 SEO）", name: "description", widget: "string", required: false }
      - { label: "正文（可选，标签页顶部导语）", name: "body", widget: "markdown", required: false }

  # 站点个性化设置：编辑 content/settings/site.json，构建时覆盖 src/site.config.ts 中的同名默认值
  - name: "settings"
    label: "站点设置"
    label_singular: "站点设置"
    files:
      - name: "site"
        label: "基本信息"
        file: "content/settings/site.json"
        format: "json"
        fields:
          - { label: "站点标题", name: "title", widget: "string", required: true }
          - { label: "作者", name: "author", widget: "string", required: true }
          - { label: "站点描述（用于 SEO 与分享摘要）", name: "description", widget: "text", required: true }
          - {
              label: "网站地址",
              name: "url",
              widget: "string",
              required: true,
              hint: "完整域名地址，用于 RSS、sitemap、OG 分享链接，如 https://example.com/",
            }
          - { label: "显示页头 Logo", name: "showLogo", widget: "boolean", default: true, required: false }
          - label: 导航菜单
            label_singular: 菜单项
            name: menu
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: 页头与页脚的导航链接，留空则使用代码中的默认菜单
            fields:
              - { label: "显示文字", name: "title", widget: "string", required: true }
              - {
                  label: "链接",
                  name: "path",
                  widget: "string",
                  required: true,
                  hint: "站内路径，如 /about/",
                }

  # 单独页面内容（如关于页），正文支持 Markdown
  - name: "page"
    label: "页面"
    label_singular: "页面"
    files:
      - name: "about"
        label: "关于页"
        file: "content/pages/about.md"
        fields:
          - { label: "页面标题", name: "title", widget: "string", required: true }
          - { label: "描述（可选，用于 SEO）", name: "description", widget: "string", required: false }
          - { label: "正文", name: "body", widget: "markdown", required: false }
